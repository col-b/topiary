[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "topiary-tui"
version = "0.1.0"
description = "A configurable TUI dashboard — btop-style layout for any command"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=0.80",
    "rich>=12",
    "psutil>=5",
    "pyte>=0.8",
]

[project.scripts]
topiary = "topiary.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["topiary*"]
