# topiary devdash.toml — developer-focused dashboard
# Runs: system stats, ticker, git branch tree, PR review, reminders

[app]
title = "topiary · devdash"

# ── Row 1: system stats + market ticker ────────────────────────────────
[[rows]]
height = "35%"

  [[rows.panes]]
  id     = "system"
  type   = "system"
  title  = "System"
  width  = "35%"

  [[rows.panes]]
  id      = "ticker"
  type    = "command"
  title   = "Market"
  command = "ticker -w AUR"      # runs in watch mode; topiary restarts if it exits
  width   = "1fr"
  # refresh not set → restart after 2s if ticker exits unexpectedly

# ── Row 2: git / PRs / reminders (tabbed) + optional log tail ──────────
[[rows]]
height = "1fr"

  [[rows.panes]]
  id    = "dev"
  type  = "tabs"
  title = "Dev"
  width = "1fr"
  tabs = [
    { title = "Git",     command = "git_branch_tree -w",    refresh = 0 },
    { title = "PRs",     command = "git_branch_tree -p -w", refresh = 0 },
    { title = "Remind",  command = "remind -w",              refresh = 0 },
  ]
